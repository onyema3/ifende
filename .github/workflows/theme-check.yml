name: Theme Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: PHP Lint
        run: find . -name "*.php" -not -path "./.git/*" -exec php -l {} \; | grep -v "No syntax errors" && exit 1 || exit 0

  theme-check:
    name: WordPress Theme Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHPCS and WP Standards
        run: |
          # Composer 2.2+ blocks plugins unless explicitly allow-listed.
          # WPCS pulls in dealerdirect/phpcodesniffer-composer-installer,
          # which auto-registers PHPCS standard paths and is safe to allow.
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer=^3.13" \
                                  "wp-coding-standards/wpcs=^3.3" \
                                  "phpcompatibility/phpcompatibility-wp=*" \
                                  --with-all-dependencies

      - name: Run PHPCS (security & correctness gate)
        run: |
          $(composer global config home)/vendor/bin/phpcs --report=summary
        # Reads phpcs.xml.dist at the repo root. The ruleset is curated to
        # security/correctness sniffs only (escaping, nonce, sanitisation,
        # i18n, deprecated APIs, PHP-version compat). Cosmetic formatting
        # sniffs are explicitly excluded — they're a separate cleanup PR.
        # Pre-existing-debt files are excluded inside phpcs.xml.dist with
        # a TODO list; chip away at those entries to expand coverage.

      - name: Check required files exist
        run: |
          echo "Checking required theme files..."
          for f in style.css index.php functions.php screenshot.png readme.txt; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Validate style.css header
        run: |
          grep -q "Theme Name:" style.css || (echo "Missing Theme Name in style.css" && exit 1)
          grep -q "Text Domain:" style.css || (echo "Missing Text Domain in style.css" && exit 1)
          grep -q "License:" style.css || (echo "Missing License in style.css" && exit 1)
          echo "style.css header valid."

  js-lint:
    name: JavaScript Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS Syntax Check
        run: node -c assets/js/main.js
